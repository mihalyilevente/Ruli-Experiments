[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruli-dependency-experiments"
version = "0.1.0"
description = "Experiments on semantic dependencies and NPO/DPO machine unlearning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.18",
    "numpy>=1.23.5",
    "scikit-learn>=1.2",
    "scipy>=1.9",
    "torch>=2.0",
    "transformers>=4.39",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"
